name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Every workspace package resolves; a dropped or missing package fails here.
      - name: Dependency tree
        run: npm ls --all --workspaces --include-workspace-root > /dev/null

      - name: Build
        run: npm run build

      - name: Check (biome, pinned deps, imports, entry graphs, typecheck, browser smoke)
        run: npm run check

      - name: Repository script tests
        run: npm run test:scripts

  test:
    name: test (${{ matrix.suite }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        suite: [coding-agent, other]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # fd and ripgrep are used by coding-agent tools tests and tui autocomplete tests.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      # The real-browser tests start the runner's Google Chrome with its sandbox on, as on a desktop.
      # Ubuntu 24.04 runners let AppArmor deny unprivileged user namespaces, so Chrome aborts with
      # "No usable sandbox!". Lift that restriction for this job instead of passing --no-sandbox.
      - name: Allow the browser sandbox
        if: matrix.suite == 'coding-agent'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        env:
          SUITE: ${{ matrix.suite }}
          FINGERS_NO_LOCAL_LLM: '1'
        run: |
          if [ "$SUITE" = coding-agent ]; then
            npm run test --workspace packages/coding-agent
            exit 0
          fi
          # Every other workspace, so new packages are tested without editing this workflow.
          args=()
          for dir in packages/*/; do
            case "$dir" in packages/coding-agent/) continue ;; esac
            args+=(--workspace "${dir%/}")
          done
          npm run test --if-present "${args[@]}"
